# Escalation Configuration

# Escalation policy definitions
escalation_policies:
  - name: critical_system_issues
    description: "Escalation policy for critical system issues"
    steps:
      - level: 1
        wait_minutes: 5
        notify:
          - primary_oncall
      - level: 2
        wait_minutes: 15
        notify:
          - secondary_oncall
      - level: 3
        wait_minutes: 30
        notify:
          - team_manager
          - lead_developer
