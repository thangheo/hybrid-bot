version: '3.8'

services:
  data_ingestion:
      build:
        context: ..
        dockerfile: docker/data_ingestion.Dockerfile
      ports:
        - "5555:5555"
      networks:
        - trading_network
      restart: unless-stopped
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    depends_on:
      - influxdb
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - INFLUXDB_HOST=influxdb
    volumes:
      - ../config:/app/config
    networks:
      - trading_network

  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    depends_on:
      - influxdb
    volumes:
      - ../python:/app/python
      - ../config:/app/config
    networks:
      - trading_network

  influxdb:
    image: influxdb:2.0
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=trading
      - DOCKER_INFLUXDB_INIT_BUCKET=marketdata
    networks:
      - trading_network

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=trading
      - POSTGRES_DB=orderstate
    networks:
      - trading_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - trading_network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - trading_network

networks:
  trading_network:

volumes:
  influxdb_data:
  postgres_data:
  grafana_data:
  prometheus_data:
