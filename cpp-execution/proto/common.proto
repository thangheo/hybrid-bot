syntax = "proto3";

package trading.common.proto;

// Exchange identifier enum
enum ExchangeIdProto {
    UNKNOWN_EXCHANGE = 0;
    BINANCE = 1;
    COINBASE = 2;
    KRAKEN = 3;
    FTX = 4;
    BITFINEX = 5;
    HUOBI = 6;
    KUCOIN = 7;
    BYBIT = 8;
}

// Timestamp with nanosecond precision
message TimestampProto {
    int64 seconds = 1;      // Seconds since epoch
    int32 nanos = 2;        // Nanoseconds component
}

// Trading symbol/pair
message SymbolProto {
    string base = 1;        // Base currency (e.g., "BTC")
    string quote = 2;       // Quote currency (e.g., "USDT")
}