version: '3.8'
services:
  python-strategy:
    build: ./python-strategy
    environment:
      - TRADING_MODE=paper
      - RISK_MULTIPLIER=0.1
    depends_on:
      - cpp-execution
    volumes:
      - ./configs:/app/configs
      
  cpp-execution:
    build: ./cpp-execution
    environment:
      - EXECUTION_MODE=simulation
      - ZMQ_THREAD_PRIORITY=-1
      - ZMQ_THREAD_SCHED_POLICY=0
      - NO_RT_SCHEDULING=1
      - DISABLE_THREAD_PRIORITY=1
    volumes:
      - ./configs:/app/configs
    # Disable real-time scheduling capabilities to prevent pthread errors
    ulimits:
      rtprio: 0
      
  monitoring:
    build: ./monitoring
    ports:
      - "8080:8080"
    depends_on:
      - python-strategy
      - cpp-execution
